<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANTT Galleries</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{min-height:100vh}.top{height:70px;border-bottom:1px solid #202020;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.logo{font-size:13px;font-weight:700;letter-spacing:.18em}.logo i{color:#7a00ff;font-style:normal}.login{min-height:calc(100vh - 70px);display:grid;place-items:center}.box{width:min(390px,90vw);border:1px solid #222;padding:32px;border-radius:16px;background:#0a0a0a}.box h1{font-size:24px;font-weight:500}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:10px;letter-spacing:.14em;color:#888}.field input,.field textarea{background:#111;border:1px solid #292929;color:#fff;border-radius:9px;padding:12px;outline:none}.btn{background:#7a00ff;border:0;color:#fff;border-radius:9px;padding:12px 15px;width:100%}.app{display:none}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 70px)}.side{border-right:1px solid #202020;padding:25px 15px}.side button{display:block;width:100%;text-align:left;border:0;background:none;color:#888;padding:12px;border-radius:9px}.side button.active{background:#151515;color:#fff}.main{padding:38px;max-width:1300px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#7a00ff}.title{font-size:40px;font-weight:500;margin-top:7px}.btnsmall{background:#7a00ff;border:0;color:#fff;border-radius:8px;padding:11px 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid #222;border-radius:14px;overflow:hidden;background:#0b0b0b}.cover{height:190px;background:radial-gradient(circle at 70% 30%,#7a00ff88,transparent 35%),linear-gradient(135deg,#241039,#0b0b0b 65%);display:flex;align-items:end;padding:18px}.body{padding:16px}.body h3{margin:0 0 8px;font-weight:500}.meta{color:#777;font-size:11px}.actions{display:flex;gap:7px;margin-top:14px}.actions button{border:1px solid #2b2b2b;background:#111;color:#fff;border-radius:7px;padding:8px 10px;font-size:11px}.panel{display:none}.panel.active{display:block}.table{display:grid;gap:8px}.row{border:1px solid #222;padding:14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20}.modal.show{display:grid}.modalbox{width:min(500px,92vw);background:#0b0b0b;border:1px solid #2a2a2a;border-radius:15px;padding:25px}.close{float:right;background:none;border:0;color:#888}.notice{color:#999;font-size:12px;margin-top:10px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:flex;border-right:0;border-bottom:1px solid #222;gap:5px;overflow:auto}.side button{white-space:nowrap}.main{padding:24px 18px}.grid{grid-template-columns:1fr}.head{align-items:start;gap:15px;flex-direction:column}.title{font-size:34px}}
</style></head><body><header class="top"><div class="logo">VANTT <i>GALLERIES</i></div><button id="logout" style="display:none;background:none;border:0;color:#888">SAIR</button></header><section id="login" class="login"><div class="box"><div class="eyebrow">PRIVATE ACCESS</div><h1>Entrar na VANTT</h1><form id="loginForm"><div class="field"><label>EMAIL</label><input id="email" value="admin@vantt.pt"></div><div class="field"><label>PASSWORD</label><input id="password" type="password" value="vantt2026"></div><button class="btn">ENTRAR</button><div id="loginError" class="notice"></div></form></div></section><section id="app" class="app"><div class="layout"><aside class="side"><button class="active" data-panel="dashboard">Dashboard</button><button data-panel="clients">Clientes</button><button data-panel="albums">Álbuns</button><button data-panel="settings">Definições</button></aside><main class="main"><div id="dashboard" class="panel active"><div class="head"><div><div class="eyebrow">CLIENT WORKSPACE</div><div class="title">DELUX</div></div><button class="btnsmall" onclick="openAlbumModal()">+ NOVO ÁLBUM</button></div><div class="grid" id="albumGrid"></div></div><div id="clients" class="panel"><div class="head"><div><div class="eyebrow">WORKSPACE</div><div class="title">Clientes</div></div><button class="btnsmall" onclick="openClientModal()">+ NOVO CLIENTE</button></div><div class="table" id="clientList"></div></div><div id="albums" class="panel"><div class="head"><div><div class="eyebrow">LIBRARY</div><div class="title">Álbuns</div></div></div><div class="table" id="albumList"></div></div><div id="settings" class="panel"><div class="eyebrow">SYSTEM</div><div class="title">Definições</div><p class="notice">VANTT Galleries · armazenamento local do servidor · pronto para deployment.</p></div></main></div></section><div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button><h2 id="modalTitle" style="font-weight:500"></h2><form id="modalForm"></form></div></div><script>
const $=s=>document.querySelector(s);let clients=[],albums=[];async function api(url,opt){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Erro');return j}async function init(){const me=await api('/api/me');if(me.authenticated)showApp();}function showApp(){$('#login').style.display='none';$('#app').style.display='block';$('#logout').style.display='block';load()}async function load(){clients=await api('/api/clients');albums=await api('/api/albums');render()}function render(){const delux=clients.find(c=>c.slug==='delux');const as=albums.filter(a=>a.clientId===delux?.id);$('#albumGrid').innerHTML=as.map(a=>`<div class="card"><div class="cover"><b>${a.name}</b></div><div class="body"><h3>${a.name}</h3><div class="meta">${a.eventDate||''} · ${a.photoCount} FOTOS</div><div class="actions"><button onclick="openAlbum('${a.id}')">ABRIR</button><button onclick="upload('${a.id}')">UPLOAD</button><button onclick="share('${a.slug}')">LINK</button></div></div></div>`).join('')||'<p class="notice">Ainda não existem álbuns.</p>';$('#clientList').innerHTML=clients.map(c=>`<div class="row"><span>${c.name}</span><span class="meta">${c.albums} álbuns</span></div>`).join('');$('#albumList').innerHTML=albums.map(a=>`<div class="row"><span><b>${a.name}</b><br><small class="meta">${a.eventDate||''}</small></span><span><button class="actions" onclick="upload('${a.id}')">UPLOAD FOTOS</button></span></div>`).join('')}document.querySelectorAll('.side button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.panel).classList.add('active')});$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});showApp()}catch(e){$('#loginError').textContent=e.message}};$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};function closeModal(){$('#modal').classList.remove('show')}function openAlbumModal(){const delux=clients.find(c=>c.slug==='delux');$('#modalTitle').textContent='Novo álbum';$('#modalForm').innerHTML=`<div class="field"><label>NOME</label><input id="mname" value="UNKNOWN" required></div><div class="field"><label>DATA</label><input id="mdate" value="08.10.2026"></div><div class="field"><label>PASSWORD OPCIONAL</label><input id="mpass" type="password"></div><button class="btn">CRIAR ÁLBUM</button>`;$('#modalForm').onsubmit=async e=>{e.preventDefault();await api('/api/albums',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId:delux.id,name:$('#mname').value,eventDate:$('#mdate').value,password:$('#mpass').value,allowDownloads:true,isPublished:true})});closeModal();await load()};$('#modal').classList.add('show')}function openClientModal(){alert('A criação de clientes está disponível na API. Esta interface pode ser expandida na próxima versão.')}function upload(id){const f=document.createElement('input');f.type='file';f.multiple=true;f.accept='image/jpeg,image/png,image/webp';f.onchange=async()=>{const fd=new FormData();[...f.files].forEach(x=>fd.append('photos',x));await api('/api/albums/'+id+'/upload',{method:'POST',body:fd});await load();alert('Upload concluído.')};f.click()}async function openAlbum(id){const a=albums.find(x=>x.id===id);const photos=await api('/api/albums/'+id+'/photos');alert(a.name+'\n\n'+photos.length+' fotografias carregadas.\n\nNa galeria pública: /g/delux/'+a.slug)}function share(slug){const url=location.origin+'/g/delux/'+slug;navigator.clipboard?.writeText(url);alert('Link copiado:\n'+url)}init();</script></body></html>
