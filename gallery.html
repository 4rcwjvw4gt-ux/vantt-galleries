<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANTT Gallery</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,Arial,sans-serif}.top{height:70px;border-bottom:1px solid #202020;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.logo{letter-spacing:.18em;font-size:12px;font-weight:700}.logo i{color:#7a00ff;font-style:normal}.hero{text-align:center;padding:70px 20px 45px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#7a00ff}.hero h1{font-size:54px;font-weight:400;letter-spacing:-.05em;margin:12px 0}.hero p{font-size:12px;color:#777}.actions{text-align:center;margin-bottom:30px}.btn{background:#fff;color:#000;border:0;border-radius:22px;padding:11px 17px;font-size:11px;cursor:pointer}.grid{padding:0 18px 60px;columns:4 220px;column-gap:9px}.photo{break-inside:avoid;margin-bottom:9px;position:relative;background:#151515;min-height:220px;border-radius:5px;overflow:hidden}.photo img{width:100%;display:block}.photo a{position:absolute;right:9px;bottom:9px;background:#ffffffe8;color:#000;text-decoration:none;border-radius:20px;padding:8px 11px;font-size:10px}.lock{min-height:70vh;display:grid;place-items:center}.box{width:min(380px,90vw);border:1px solid #222;padding:30px;border-radius:14px;background:#0b0b0b}.field{display:grid;gap:8px;margin:15px 0}.field input{background:#111;border:1px solid #292929;color:#fff;padding:12px;border-radius:8px}.submit{width:100%;padding:12px;border:0;border-radius:8px;background:#7a00ff;color:#fff}@media(max-width:800px){.hero h1{font-size:38px}.grid{columns:2 140px;padding:0 8px}}
</style></head><body><header class="top"><div class="logo">VANTT <i>×</i> GALLERY</div><div id="clientName" style="font-size:11px;color:#888"></div></header><main id="root"></main><script>const parts=location.pathname.split('/').filter(Boolean),client=parts[1],album=parts[2];const root=document.querySelector('#root');async function api(url,opt){const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}async function load(){const d=await api('/api/public/'+client+'/'+album);if(d.locked){root.innerHTML='<section class="lock"><div class="box"><div class="eyebrow">PRIVATE GALLERY</div><h2>'+d.album.name+'</h2><p style="color:#777;font-size:12px">Esta galeria está protegida.</p><form id="f"><div class="field"><label>PASSWORD</label><input id="pw" type="password"></div><button class="submit">ABRIR GALERIA</button><div id="e" style="color:#f66;font-size:12px;margin-top:10px"></div></form></div></section>';document.querySelector('#f').onsubmit=async e=>{e.preventDefault();try{await api('/api/public/'+client+'/'+album+'/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#pw').value})});load()}catch(x){document.querySelector('#e').textContent=x.message}};return}document.querySelector('#clientName').textContent=d.client.name;root.innerHTML='<section class="hero"><div class="eyebrow">'+d.client.name+' · EVENT PHOTOGRAPHY</div><h1>'+d.album.name+'</h1><p>'+d.album.eventDate+' · PHOTOGRAPHY BY VANTT</p></section><div class="actions">'+(d.album.allowDownloads?'<a class="btn" href="/api/public/'+client+'/'+album+'/download-all">DOWNLOAD ALL</a>':'')+'</div><section class="grid">'+d.photos.map(p=>'<div class="photo"><img loading="lazy" src="'+p.thumb+'"><a href="/api/public/'+client+'/'+album+'/download/'+p.id">↓ DOWNLOAD</a></div>').join('')+'</section>'}load().catch(e=>root.innerHTML='<div class="lock"><div><h2>Galeria não encontrada</h2><p style="color:#777">O link pode estar incorreto ou o álbum ainda não foi publicado.</p></div></div>');</script></body></html>
